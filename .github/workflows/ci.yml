name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        # The noble packages need Node 20.19 and pnpm 11 needs 22.13, so the
        # matrix starts at 22; the package itself runs on 20.19+.
        node: ["22", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile || bun install
      - run: bun test
      - run: bun bin/x402.js --help

  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Deno resolves the noble packages from node_modules next to package.json.
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test -A --no-check test/
      - run: deno run -A bin/x402.js --help
